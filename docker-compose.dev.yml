services:
  postgres:
    environment:
      POSTGRES_DB: aiverse_dev
    ports:
      - "5433:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - DEBUG=True
      - ENVIRONMENT=development
      - DATABASE_ECHO=True
    volumes:
      - .:/app
      - /app/venv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload