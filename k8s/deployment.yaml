apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiverse-api
  labels:
    app: aiverse-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aiverse-api
  template:
    metadata:
      labels:
        app: aiverse-api
    spec:
      containers:
      - name: api
        image: ghcr.io/yourusername/aiverse-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aiverse-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aiverse-secrets
              key: secret-key
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5